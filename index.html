<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>韓国語 Daily 3000</title>
<p id="status">アプリを読み込み中...</p>
<script>
(async()=>{
  try{
    const r=await fetch('./index-upload.html?cloud=9',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    if(!html.includes("const APP_VERSION=\"0.6\";")) throw new Error("更新ポイント 1 が見つかりません");
    html=html.replace("const APP_VERSION=\"0.6\";","const APP_VERSION=\"0.9\";");
    if(!html.includes("let queue=[], current=null;")) throw new Error("更新ポイント 2 が見つかりません");
    html=html.replace("let queue=[], current=null;","let queue=[], current=null;\nlet extraAllowance = 0;\nlet extraUnlimitedMode = false;");
    if(!html.includes("let extraAllowance = 0;\nlet extraUnlimitedMode = false;\n\nfunction remainingNewCards()")) throw new Error("更新ポイント 3 が見つかりません");
    html=html.replace("let extraAllowance = 0;\nlet extraUnlimitedMode = false;\n\nfunction remainingNewCards()","function remainingNewCards()");
    if(!html.includes("<div class=\"panel\">\n<h2 style=\"margin-top:0\">データ</h2>")) throw new Error("更新ポイント 4 が見つかりません");
    html=html.replace("<div class=\"panel\">\n<h2 style=\"margin-top:0\">データ</h2>","<div class=\"panel\" id=\"cloudPanel\">\n<h2 style=\"margin-top:0\">クラウド同期</h2>\n<div id=\"cloudLoggedOut\">\n  <p class=\"muted\" style=\"margin-top:0\">同じメールアドレスでログインすると、PC・iPad・スマホで学習履歴を共有できます。ログインしていない間も、この端末には通常どおり保存されます。</p>\n  <label for=\"cloudEmail\">メールアドレス</label>\n  <input id=\"cloudEmail\" type=\"email\" autocomplete=\"email\" placeholder=\"name@example.com\">\n  <div class=\"controls\" style=\"justify-content:flex-start;margin-top:10px\">\n    <button type=\"button\" id=\"cloudLoginBtn\" class=\"btn primary\">ログイン用メールを送る</button>\n  </div>\n</div>\n<div id=\"cloudLoggedIn\" class=\"hidden\">\n  <div><b>ログイン中:</b> <span id=\"cloudUserEmail\"></span></div>\n  <div class=\"controls\" style=\"justify-content:flex-start;margin-top:10px\">\n    <button type=\"button\" id=\"cloudSyncNowBtn\" class=\"btn primary\">今すぐ同期</button>\n    <button type=\"button\" id=\"cloudLogoutBtn\" class=\"btn outline\">ログアウト</button>\n  </div>\n  <p class=\"muted\" style=\"margin-bottom:0\">採点・既知登録・設定変更のたびに自動同期します。複数端末の変更があれば、カードごとの最新学習結果を優先して統合します。</p>\n</div>\n<div id=\"cloudStatus\" class=\"muted\" aria-live=\"polite\" style=\"margin-top:10px\">クラウド機能を初期化中...</div>\n</div>\n<div class=\"panel\">\n<h2 style=\"margin-top:0\">データ</h2>");
    if(!html.includes("<div class=\"webapp-note\">\n  <b>Web公開版 v0.6</b><br>\n  同じURL・同じブラウザでは、アプリを更新しても学習履歴を引き継ぐ設計です。\n  端末をまたぐ同期はまだ未対応なので、週1回程度「進捗JSONを書き出す」でバックアップしてください。\n</div>")) throw new Error("更新ポイント 5 が見つかりません");
    html=html.replace("<div class=\"webapp-note\">\n  <b>Web公開版 v0.6</b><br>\n  同じURL・同じブラウザでは、アプリを更新しても学習履歴を引き継ぐ設計です。\n  端末をまたぐ同期はまだ未対応なので、週1回程度「進捗JSONを書き出す」でバックアップしてください。\n</div>","<div class=\"webapp-note\">\n  <b>Web公開版 v0.9 · クラウド同期対応</b><br>\n  ログインすると、PC・iPad・スマホで同じ学習履歴を共有します。ローカル保存も残るため、一時的にオフラインでも学習できます。JSONバックアップ機能も引き続き利用できます。\n</div>");
    if(!html.includes("function todayKey(){return new Date().toISOString().slice(0,10)}")) throw new Error("更新ポイント 6 が見つかりません");
    html=html.replace("function todayKey(){return new Date().toISOString().slice(0,10)}","\nconst CLOUD_PROJECT_URL=\"https://dsvyldxgyakhalfbbxvq.supabase.co\";\nconst CLOUD_PUBLISHABLE_KEY=\"sb_publishable_m-inug-6RjI1Wx6Y-DZe6Q_5Un2XSmb\";\nconst CLOUD_TABLE=\"korean_learning_state\";\nconst CLOUD_SYNC_KEY=\"korean-daily-3000-sync-v01\";\nlet supabaseClient=null;\nlet cloudUser=null;\nlet cloudSyncMeta={userId:null,localChangedAt:null,cloudSavedAt:null};\nlet cloudSaveTimer=null;\nlet cloudSyncRunning=false;\nlet cloudDirty=false;\nlet cloudReady=false;\n\nfunction cloudStatus(msg,kind=\"\"){\n  const el=document.getElementById(\"cloudStatus\");\n  if(!el)return;\n  el.textContent=msg;\n  el.style.color=kind===\"error\"?\"#b42318\":kind===\"ok\"?\"#067647\":\"\";\n}\nfunction loadCloudSyncMeta(){\n  try{const raw=localStorage.getItem(CLOUD_SYNC_KEY);if(raw)cloudSyncMeta={...cloudSyncMeta,...JSON.parse(raw)};}catch(e){}\n}\nfunction saveCloudSyncMeta(){\n  try{localStorage.setItem(CLOUD_SYNC_KEY,JSON.stringify(cloudSyncMeta));}catch(e){}\n}\nfunction markLocalChanged(){\n  cloudSyncMeta.localChangedAt=new Date().toISOString();\n  saveCloudSyncMeta();\n}\nfunction updateCloudUI(){\n  const out=document.getElementById(\"cloudLoggedOut\"),inside=document.getElementById(\"cloudLoggedIn\"),mail=document.getElementById(\"cloudUserEmail\");\n  if(!out||!inside)return;\n  const logged=!!cloudUser;\n  out.classList.toggle(\"hidden\",logged);\n  inside.classList.toggle(\"hidden\",!logged);\n  if(mail)mail.textContent=cloudUser?.email||\"\";\n}\nfunction jsonClone(x){return x==null?x:JSON.parse(JSON.stringify(x));}\nfunction reviewKey(r){return [r.rank,r.at,r.grade,r.mode||\"\"].join(\"|\");}\nfunction reviewTimes(s){\n  const m={};\n  for(const r of (s?.reviews||[])){if(r?.rank&&r?.at&&(!m[r.rank]||r.at>m[r.rank]))m[r.rank]=r.at;}\n  return m;\n}\nfunction mergeLearningState(localState,remoteState){\n  const L=localState||{cards:{},reviews:[],daily:{}}, R=remoteState||{cards:{},reviews:[],daily:{}};\n  const seen=new Map();\n  for(const r of [...(R.reviews||[]),...(L.reviews||[])]){if(r&&r.rank&&r.at)seen.set(reviewKey(r),r);}\n  const reviews=[...seen.values()].sort((a,b)=>String(a.at).localeCompare(String(b.at)));\n  const lt=reviewTimes(L),rt=reviewTimes(R),cards={};\n  const ranks=new Set([...Object.keys(R.cards||{}),...Object.keys(L.cards||{})]);\n  for(const rk of ranks){\n    const lc=L.cards?.[rk], rc=R.cards?.[rk];\n    if(!lc)cards[rk]=jsonClone(rc);\n    else if(!rc)cards[rk]=jsonClone(lc);\n    else if((lt[rk]||\"\")>(rt[rk]||\"\"))cards[rk]=jsonClone(lc);\n    else if((rt[rk]||\"\")>(lt[rk]||\"\"))cards[rk]=jsonClone(rc);\n    else{\n      const ls=Number(lc.reps||0),rs=Number(rc.reps||0);\n      cards[rk]=jsonClone(ls>=rs?lc:rc);\n    }\n  }\n  const computed={};\n  const first={};\n  for(const r of reviews){const k=String(r.rank);if(!first[k]||r.at<first[k])first[k]=r.at;}\n  for(const at of Object.values(first)){const d=String(at).slice(0,10);computed[d]=computed[d]||{introduced:0};computed[d].introduced++;}\n  const days=new Set([...Object.keys(L.daily||{}),...Object.keys(R.daily||{}),...Object.keys(computed)]),daily={};\n  for(const d of days)daily[d]={introduced:Math.max(Number(L.daily?.[d]?.introduced||0),Number(R.daily?.[d]?.introduced||0),Number(computed[d]?.introduced||0))};\n  return {cards,reviews,daily};\n}\nfunction normalizeCloudPayload(obj){\n  if(!obj)return null;\n  if(obj.learningState)return {learningState:obj.learningState,settings:obj.settings||null,savedAt:obj.savedAt||null};\n  if(obj.cards||obj.reviews)return {learningState:obj,settings:null,savedAt:null};\n  return null;\n}\nfunction localLooksEmpty(){return !(state?.reviews?.length) && !Object.values(state?.cards||{}).some(x=>x?.introduced);}\nfunction makeCloudPayload(savedAt){return {schema:1,appVersion:APP_VERSION,savedAt,learningState:state,settings};}\nfunction persistCloudMergedLocally(){\n  try{\n    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));\n    localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));\n  }catch(e){}\n}\nasync function syncCloudCore(showMessage=true){\n  if(!supabaseClient||!cloudUser)return;\n  if(cloudSyncRunning){cloudDirty=true;return;}\n  cloudSyncRunning=true;\n  try{\n    if(showMessage)cloudStatus(\"同期中...\");\n    const {data,error}=await supabaseClient.from(CLOUD_TABLE).select(\"state,updated_at\").eq(\"user_id\",cloudUser.id).maybeSingle();\n    if(error)throw error;\n    const remote=normalizeCloudPayload(data?.state);\n    const accountChanged=cloudSyncMeta.userId && cloudSyncMeta.userId!==cloudUser.id;\n    if(remote){\n      if(accountChanged){\n        state=jsonClone(remote.learningState);\n        if(remote.settings)settings={...settings,...remote.settings};\n      }else{\n        state=mergeLearningState(state,remote.learningState);\n        const localT=cloudSyncMeta.localChangedAt||\"\";\n        const remoteT=remote.savedAt||data?.updated_at||\"\";\n        if(remote.settings && remoteT>localT)settings={...settings,...remote.settings};\n      }\n      persistCloudMergedLocally();\n      if(current?.rank) current.meta=getMeta(current.rank);\n    }else if(accountChanged){\n      state={cards:{},reviews:[],daily:{}};\n      persistCloudMergedLocally();\n      if(current?.rank) current.meta=getMeta(current.rank);\n    }\n    const now=new Date().toISOString();\n    const {error:upErr}=await supabaseClient.from(CLOUD_TABLE).upsert({user_id:cloudUser.id,state:makeCloudPayload(now),updated_at:now},{onConflict:\"user_id\"});\n    if(upErr)throw upErr;\n    cloudSyncMeta.userId=cloudUser.id;\n    cloudSyncMeta.cloudSavedAt=now;\n    cloudSyncMeta.localChangedAt=now;\n    saveCloudSyncMeta();\n    if(document.getElementById(\"newPerDay\"))document.getElementById(\"newPerDay\").value=settings.newPerDay;\n    if(document.getElementById(\"retention\"))document.getElementById(\"retention\").value=settings.retention;\n    if(typeof updateStats===\"function\")updateStats();\n    if(typeof buildQueue===\"function\" && !current)buildQueue();\n    if(typeof renderRank===\"function\")renderRank();\n    cloudStatus(\"同期済み · \"+new Date().toLocaleTimeString([],{hour:\"2-digit\",minute:\"2-digit\"}),\"ok\");\n  }catch(e){\n    console.error(\"Cloud sync error\",e);\n    let msg=e?.message||String(e);\n    if(/relation.*does not exist|schema cache|Could not find the table/i.test(msg))msg=\"クラウド保存テーブルが見つかりません。SupabaseのSQL設定を確認してください。\";\n    cloudStatus(\"同期エラー: \"+msg,\"error\");\n  }finally{\n    cloudSyncRunning=false;\n    if(cloudDirty){cloudDirty=false;setTimeout(()=>syncCloudCore(false),150);}\n  }\n}\nfunction queueCloudSave(){\n  if(!cloudReady||!cloudUser)return;\n  cloudDirty=true;\n  clearTimeout(cloudSaveTimer);\n  cloudSaveTimer=setTimeout(()=>{cloudDirty=false;syncCloudCore(false);},700);\n}\nasync function sendMagicLink(){\n  if(!supabaseClient)return;\n  const email=(document.getElementById(\"cloudEmail\")?.value||\"\").trim();\n  if(!email){cloudStatus(\"メールアドレスを入力してください。\",\"error\");return;}\n  const btn=document.getElementById(\"cloudLoginBtn\");if(btn)btn.disabled=true;\n  try{\n    cloudStatus(\"ログイン用メールを送信中...\");\n    const redirectTo=location.origin+location.pathname;\n    const {error}=await supabaseClient.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo}});\n    if(error)throw error;\n    cloudStatus(\"メールを送信しました。この端末でメール内のログインリンクを開いてください。\",\"ok\");\n  }catch(e){cloudStatus(\"送信エラー: \"+(e?.message||e),\"error\");}\n  finally{if(btn)btn.disabled=false;}\n}\nasync function handleSignedIn(user){\n  cloudUser=user||null;updateCloudUI();\n  if(cloudUser)await syncCloudCore(true);\n}\nasync function initCloudSync(){\n  loadCloudSyncMeta();\n  const loginBtn=document.getElementById(\"cloudLoginBtn\"),syncBtn=document.getElementById(\"cloudSyncNowBtn\"),logoutBtn=document.getElementById(\"cloudLogoutBtn\");\n  if(loginBtn)loginBtn.addEventListener(\"click\",sendMagicLink);\n  if(syncBtn)syncBtn.addEventListener(\"click\",()=>syncCloudCore(true));\n  if(logoutBtn)logoutBtn.addEventListener(\"click\",async()=>{\n    if(!supabaseClient)return;\n    await supabaseClient.auth.signOut();cloudUser=null;updateCloudUI();cloudStatus(\"ログアウトしました。この端末の学習履歴は残っています。\");\n  });\n  try{\n    cloudStatus(\"クラウド機能を読み込み中...\");\n    const mod=await Promise.race([\n      import(\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm\"),\n      new Promise((_,rej)=>setTimeout(()=>rej(new Error(\"クラウドライブラリの読み込みがタイムアウトしました\")),7000))\n    ]);\n    supabaseClient=mod.createClient(CLOUD_PROJECT_URL,CLOUD_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});\n    supabaseClient.auth.onAuthStateChange((event,session)=>{\n      if(event===\"SIGNED_OUT\"){cloudUser=null;updateCloudUI();return;}\n      if(session?.user && (!cloudUser||cloudUser.id!==session.user.id))setTimeout(()=>handleSignedIn(session.user),0);\n    });\n    const {data:{session},error}=await supabaseClient.auth.getSession();\n    if(error)throw error;\n    cloudUser=session?.user||null;\n    updateCloudUI();\n    cloudReady=true;\n    if(cloudUser)await syncCloudCore(true);else cloudStatus(\"未ログイン · 現在はこの端末だけに保存されています。\");\n    document.addEventListener(\"visibilitychange\",()=>{if(document.visibilityState===\"hidden\"&&cloudUser)queueCloudSave();});\n    window.addEventListener(\"online\",()=>{if(cloudUser)syncCloudCore(false);});\n  }catch(e){\n    cloudReady=false;cloudUser=null;updateCloudUI();\n    cloudStatus(\"クラウド機能を利用できません。ローカル保存で継続できます: \"+(e?.message||e),\"error\");\n  }\n}\n\nfunction todayKey(){return new Date().toISOString().slice(0,10)}");
    if(!html.includes("function save(){\n  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}catch(e){}\n}")) throw new Error("更新ポイント 7 が見つかりません");
    html=html.replace("function save(){\n  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}catch(e){}\n}","function save(){\n  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}catch(e){}\n  markLocalChanged();\n  queueCloudSave();\n}");
    if(!html.includes("load();\ndocument.getElementById(\"newPerDay\").value=settings.newPerDay;")) throw new Error("更新ポイント 8 が見つかりません");
    html=html.replace("load();\ndocument.getElementById(\"newPerDay\").value=settings.newPerDay;","load();\nawait initCloudSync();\ndocument.getElementById(\"newPerDay\").value=settings.newPerDay;");
    if(!html.includes("queue=[...due,...news];")) throw new Error("更新ポイント 10 が見つかりません");
    html=html.replace("queue=[...due,...news];","queue=[...new Set([...due,...news])].filter(r=>!current||r!==current.rank);");
    if(!html.includes("const {rank,meta}=current, now=new Date();")) throw new Error("更新ポイント 11 が見つかりません");
    html=html.replace("const {rank,meta}=current, now=new Date();","current.meta=getMeta(current.rank);\n  const {rank,meta}=current, now=new Date();");
    const gradeTail = `  save();\n  updateStats();\n\n  // Always advance to the next queued card.\n  showCurrent();\n\n  document.querySelectorAll("[data-grade]").forEach(b=>b.disabled=false);`;
    if(!html.includes(gradeTail)) throw new Error("更新ポイント 12 が見つかりません");
    html=html.replace(gradeTail, `  save();\n  try{ updateStats(); }catch(e){ console.error("updateStats after grade",e); }\n\n  // Last-card completion must not depend on any later sync/render work.\n  if(queue.length){\n    try{ showCurrent(); }catch(e){ console.error("advance after grade",e); }\n  }else{\n    current=null;\n    const cs=document.getElementById("cardState"), es=document.getElementById("emptyState"), p=document.querySelector("#emptyState .prompt"), sb=document.getElementById("startBtn");\n    if(cs)cs.classList.add("hidden");\n    if(es)es.classList.remove("hidden");\n    if(p)p.textContent="今日の予定分は完了しました。追加学習もできます。";\n    if(sb)sb.textContent="キューを再確認";\n    try{ updateStats(); }catch(e){ console.error("updateStats at completion",e); }\n    setTimeout(()=>{ try{ if(typeof showExtraStudyPanel==="function")showExtraStudyPanel(); }catch(e){} },0);\n  }\n\n  document.querySelectorAll("[data-grade]").forEach(b=>b.disabled=false);`);
    const knownTail = `  state.reviews.push({rank:current.rank,at:now.toISOString(),grade:"KnownFast",mode:"recognition"});\n  save();updateStats();showCurrent();`;
    if(!html.includes(knownTail)) throw new Error("更新ポイント 13 が見つかりません");
    html=html.replace(knownTail, `  state.reviews.push({rank:current.rank,at:now.toISOString(),grade:"KnownFast",mode:"recognition"});\n  save();\n  try{updateStats();}catch(e){console.error("updateStats after known",e);}\n  if(queue.length){try{showCurrent();}catch(e){console.error("advance after known",e);}}\n  else{\n    current=null;\n    const cs=document.getElementById("cardState"), es=document.getElementById("emptyState"), p=document.querySelector("#emptyState .prompt"), sb=document.getElementById("startBtn");\n    if(cs)cs.classList.add("hidden"); if(es)es.classList.remove("hidden");\n    if(p)p.textContent="今日の予定分は完了しました。追加学習もできます。"; if(sb)sb.textContent="キューを再確認";\n    setTimeout(()=>{try{if(typeof showExtraStudyPanel==="function")showExtraStudyPanel();}catch(e){}},0);\n  }`);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('status').textContent='読み込みに失敗しました: '+e.message;
    console.error(e);
  }
})();
</script>
