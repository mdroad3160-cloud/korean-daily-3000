name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax audit
        run: |
          node --check pack-876-900-v1.4.8.js
          node --check inject-v1.4.8.js
          node --check pack-901-1000-v1.4.9.js
          node --check inject-v1.4.9.js
          node --check pack-1001-1100-v1.4.10.js
          node --check inject-v1.4.10.js
      - name: Build stable through Rank 1000
        run: |
          rm -rf _site
          node normalize-build-input.js index-upload.html _index-upload-build.html
          NODE_OPTIONS="--require=$PWD/pack-v1.2-hook.js" node build-direct-v1.js index-v09.html _index-upload-build.html _site/index.html
          node inject-v1.3.js _site/index.html
          node inject-v1.4.3.js _site/index.html
          node inject-v1.4.4.js _site/index.html
          node inject-v1.4.5.js _site/index.html
          node inject-v1.4.6.js _site/index.html
          node inject-v1.4.7.js _site/index.html
          node inject-v1.4.8.js _site/index.html
          node inject-v1.4.9.js _site/index.html
      - name: Audit cards and token coverage
        run: AUDIT_STOP_AFTER=cards node inject-v1.4.10.js _site/index.html
      - name: Audit Rank mapping
        run: AUDIT_STOP_AFTER=rank node inject-v1.4.10.js _site/index.html
      - name: Audit grammar links
        run: AUDIT_STOP_AFTER=grammar node inject-v1.4.10.js _site/index.html
      - name: Audit duplicates 1001-1006
        run: DUP_MIN=1001 DUP_MAX=1006 AUDIT_STOP_AFTER=dupes node inject-v1.4.10.js _site/index.html
      - name: Audit duplicates 1007-1012
        run: DUP_MIN=1007 DUP_MAX=1012 AUDIT_STOP_AFTER=dupes node inject-v1.4.10.js _site/index.html
      - name: Audit duplicates 1013-1025
        run: DUP_MIN=1013 DUP_MAX=1025 AUDIT_STOP_AFTER=dupes node inject-v1.4.10.js _site/index.html
      - name: Audit duplicates 1026-1050
        run: DUP_MIN=1026 DUP_MAX=1050 AUDIT_STOP_AFTER=dupes node inject-v1.4.10.js _site/index.html
      - name: Audit duplicates 1051-1075
        run: DUP_MIN=1051 DUP_MAX=1075 AUDIT_STOP_AFTER=dupes node inject-v1.4.10.js _site/index.html
      - name: Audit duplicates 1076-1100
        run: DUP_MIN=1076 DUP_MAX=1100 AUDIT_STOP_AFTER=dupes node inject-v1.4.10.js _site/index.html
      - name: Audit and inject Rank 1001-1100
        run: node inject-v1.4.10.js _site/index.html
      - name: Finalize app shell
        run: |
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
