name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax audit
        run: |
          node --check pack-876-900-v1.4.8.js
          node --check inject-v1.4.8.js
          node --check pack-901-1000-v1.4.9.js
          node --check inject-v1.4.9.js
          node --check pack-1001-1100-v1.4.10.js
          node --check inject-v1.4.10.js
          node --check pack-1101-1200-v1.4.11.js
          node --check inject-v1.4.11.js
          node --check pack-1201-1300-v1.4.12.js
          node --check inject-v1.4.12.js
      - name: Build stable through Rank 1000
        run: |
          rm -rf _site
          node normalize-build-input.js index-upload.html _index-upload-build.html
          NODE_OPTIONS="--require=$PWD/pack-v1.2-hook.js" node build-direct-v1.js index-v09.html _index-upload-build.html _site/index.html
          node inject-v1.3.js _site/index.html
          node inject-v1.4.3.js _site/index.html
          node inject-v1.4.4.js _site/index.html
          node inject-v1.4.5.js _site/index.html
          node inject-v1.4.6.js _site/index.html
          node inject-v1.4.7.js _site/index.html
          node inject-v1.4.8.js _site/index.html
          node inject-v1.4.9.js _site/index.html
      - name: Audit and inject Rank 1001-1100
        run: node inject-v1.4.10.js _site/index.html
      - name: Audit cards and token coverage 1101-1200
        run: AUDIT_STOP_AFTER=cards node inject-v1.4.11.js _site/index.html
      - name: Audit Rank mapping 1101-1200
        run: AUDIT_STOP_AFTER=rank node inject-v1.4.11.js _site/index.html
      - name: Audit grammar links 1101-1200
        run: AUDIT_STOP_AFTER=grammar node inject-v1.4.11.js _site/index.html
      - name: Audit duplicates 1101-1125
        run: DUP_MIN=1101 DUP_MAX=1125 AUDIT_STOP_AFTER=dupes node inject-v1.4.11.js _site/index.html
      - name: Audit duplicates 1126-1150
        run: DUP_MIN=1126 DUP_MAX=1150 AUDIT_STOP_AFTER=dupes node inject-v1.4.11.js _site/index.html
      - name: Audit duplicates 1151-1175
        run: DUP_MIN=1151 DUP_MAX=1175 AUDIT_STOP_AFTER=dupes node inject-v1.4.11.js _site/index.html
      - name: Audit duplicates 1176-1200
        run: DUP_MIN=1176 DUP_MAX=1200 AUDIT_STOP_AFTER=dupes node inject-v1.4.11.js _site/index.html
      - name: Audit and inject Rank 1101-1200
        run: node inject-v1.4.11.js _site/index.html
      - name: Audit cards and token coverage 1201-1300
        run: AUDIT_STOP_AFTER=cards node inject-v1.4.12.js _site/index.html
      - name: Audit Rank mapping 1201-1300
        run: AUDIT_STOP_AFTER=rank node inject-v1.4.12.js _site/index.html
      - name: Audit grammar links 1201-1300
        run: AUDIT_STOP_AFTER=grammar node inject-v1.4.12.js _site/index.html
      - name: Audit duplicates 1201-1225
        run: DUP_MIN=1201 DUP_MAX=1225 AUDIT_STOP_AFTER=dupes node inject-v1.4.12.js _site/index.html
      - name: Audit duplicates 1226-1250
        run: DUP_MIN=1226 DUP_MAX=1250 AUDIT_STOP_AFTER=dupes node inject-v1.4.12.js _site/index.html
      - name: Audit duplicates 1251-1275
        run: DUP_MIN=1251 DUP_MAX=1275 AUDIT_STOP_AFTER=dupes node inject-v1.4.12.js _site/index.html
      - name: Audit duplicates 1276-1300
        run: DUP_MIN=1276 DUP_MAX=1300 AUDIT_STOP_AFTER=dupes node inject-v1.4.12.js _site/index.html
      - name: Audit and inject Rank 1201-1300
        run: node inject-v1.4.12.js _site/index.html
      - name: Finalize app shell
        run: |
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
