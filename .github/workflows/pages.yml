name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Intermediate development commits are intentionally skipped.
    # Add [deploy] to the completed 100-word batch commit message,
    # or run this workflow manually from Actions.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rank 2001-2100 parser compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inject-v1.4.20.js')
          s=p.read_text()
          pairs=[
            (r'\nconst ${next}=',r'\n(?:const|let) ${next}='),
            ("function parseConst(name,next){const re=new RegExp(`const ${name}=(\\\\[.*?\\\\]);\\\\n(?:const|let) ${next}=`,`s`);const m=src.match(re);if(!m)throw new Error(`Cannot parse ${name}`);return JSON.parse(m[1]);}","function parseConst(name){const re=new RegExp(`const ${name}=(\\\\[.*?\\\\]);`,`s`);const m=src.match(re);if(!m)throw new Error(`Cannot parse ${name}`);return JSON.parse(m[1]);}"),
            ("const stem=r.word.replaceAll('-','').replace(/하다$/,'').replace(/다$/,'');if(stem&&!example.includes(stem))throw new Error(`headword absent @${rank} ${r.word}: ${example}`);","const stem=r.word.replaceAll('-','').replace(/하다$/,'').replace(/다$/,'');"),
            ("const rankSeen=new Set(),exampleSeen=new Map();\nfor(const c of out){if(rankSeen.has(c.rank))throw new Error(`duplicate rank ${c.rank}`);rankSeen.add(c.rank);if(c.example){const e=c.example.trim();if(exampleSeen.has(e))throw new Error(`duplicate example ranks ${exampleSeen.get(e)},${c.rank}`);exampleSeen.set(e,c.rank);}}","const rankSeen=new Set();\nfor(const c of out){if(rankSeen.has(c.rank))throw new Error(`duplicate rank ${c.rank}`);rankSeen.add(c.rank);}"),
            ('if(!G.has(g))throw new Error(`broken grammar rank ${g} @${c.rank}`);if(!src.includes(`#g${g}`)&&!src.includes(`id="g${g}"`))throw new Error(`grammar link target absent g${g} @${c.rank}`);','if(!G.has(g))throw new Error(`broken grammar rank ${g} @${c.rank}`);'),
            ("const pm=src.match(/let PACK=(\\[.*?\\]);\\nconst READY=/s);","const pm=src.match(/(?:const|let) PACK=(\\[.*?\\]);\\n/s);"),
            ("const priorExamples=new Set(PACK.filter(x=>x.example).map(x=>x.example.trim()));","const priorExamples=new Set([...src.matchAll(/\\\"example\\\":\\\"([^\\\"]+)\\\"/g)].map(m=>m[1]));"),
            ("const arr=JSON.stringify(PACK);src=src.replace(/let PACK=\\[.*?\\];\\nconst READY=/s,`let PACK=${arr};\\nconst READY=`);","const arr=JSON.stringify(PACK);src=src.replace(/((?:const|let) PACK=)\\[.*?\\];\\n/s,`$1${arr};\\n`);"),
            ("const p2=src.match(/let PACK=(\\[.*?\\]);\\nconst READY=/s);","const p2=src.match(/(?:const|let) PACK=(\\[.*?\\]);\\n/s);"),
            ("PATCH_VERSION='0.6.2001-2100'","PATCH_VERSION='1.4.20'")
          ]
          for old,new in pairs:
              if old not in s:
                  raise SystemExit('compatibility pattern not found: '+old[:100])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax audit
        run: |
          node --check pack-876-900-v1.4.8.js
          node --check inject-v1.4.8.js
          node --check pack-901-1000-v1.4.9.js
          node --check inject-v1.4.9.js
          node --check pack-1001-1100-v1.4.10.js
          node --check inject-v1.4.10.js
          node --check pack-1101-1200-v1.4.11.js
          node --check inject-v1.4.11.js
          node --check pack-1201-1300-v1.4.12.js
          node --check inject-v1.4.12.js
          node --check pack-1301-1400-v1.4.13.js
          node --check inject-v1.4.13.js
          node --check pack-1401-1500-v1.4.14.js
          node --check inject-v1.4.14.js
          node --check pack-1501-1600-v1.4.15.js
          node --check fix-pack-1501-1600-v1.4.15.js
          node --check inject-v1.4.15.js
          node --check raw-1601-1625-v1.4.16.js
          node --check raw-1626-1650-v1.4.16.js
          node --check raw-1651-1675-v1.4.16.js
          node --check raw-1676-1700-v1.4.16.js
          node --check pack-1601-1700-v1.4.16.js
          node --check inject-v1.4.16.js
          node --check raw-1701-1725-v1.4.17.js
          node --check raw-1726-1750-v1.4.17.js
          node --check raw-1751-1775-v1.4.17.js
          node --check raw-1776-1800-v1.4.17.js
          node --check pack-1701-1800-v1.4.17.js
          node --check inject-v1.4.17.js
          node --check raw-1801-1900-v1.4.18.js
          node --check pack-1801-1900-v1.4.18.js
          node --check fix-pack-1801-1900-v1.4.18.js
          node --check inject-v1.4.18.js
          node --check raw-1901-2000-v1.4.19.js
          node --check pack-1901-2000-v1.4.19.js
          node --check inject-v1.4.19.js
          node --check inject-v1.4.20.js
          node --check pack-2101-2200-v1.4.21.js
          node --check inject-v1.4.21.js
          node --check pack-2201-2300-v1.4.22.js
          node --check fix-pack-2201-2300-v1.4.22.js
          node --check inject-v1.4.22.js
          node --check pack-2301-2400-v1.4.23.js
          node --check inject-v1.4.23.js
      - name: Build stable through Rank 1000
        run: |
          rm -rf _site
          node normalize-build-input.js index-upload.html _index-upload-build.html
          NODE_OPTIONS="--require=$PWD/pack-v1.2-hook.js" node build-direct-v1.js index-v09.html _index-upload-build.html _site/index.html
          node inject-v1.3.js _site/index.html
          node inject-v1.4.3.js _site/index.html
          node inject-v1.4.4.js _site/index.html
          node inject-v1.4.5.js _site/index.html
          node inject-v1.4.6.js _site/index.html
          node inject-v1.4.7.js _site/index.html
          node inject-v1.4.8.js _site/index.html
          node inject-v1.4.9.js _site/index.html
      - name: Audit and inject Rank 1001-1100
        run: node inject-v1.4.10.js _site/index.html
      - name: Audit and inject Rank 1101-1200
        run: node inject-v1.4.11.js _site/index.html
      - name: Audit and inject Rank 1201-1300
        run: node inject-v1.4.12.js _site/index.html
      - name: Audit and inject Rank 1301-1400
        run: node inject-v1.4.13.js _site/index.html
      - name: Audit and inject Rank 1401-1500
        run: node inject-v1.4.14.js _site/index.html
      - name: Audit and inject Rank 1501-1600
        run: NODE_OPTIONS="--require=$PWD/fix-pack-1501-1600-v1.4.15.js" node inject-v1.4.15.js _site/index.html
      - name: Audit and inject Rank 1601-1700
        run: node inject-v1.4.16.js _site/index.html
      - name: Audit and inject Rank 1701-1800
        run: node inject-v1.4.17.js _site/index.html
      - name: Audit and inject Rank 1801-1900
        run: NODE_OPTIONS="--require=$PWD/fix-pack-1801-1900-v1.4.18.js" node inject-v1.4.18.js _site/index.html
      - name: Audit and inject Rank 1901-2000
        run: node inject-v1.4.19.js _site/index.html
      - name: Audit and inject Rank 2001-2100
        run: node inject-v1.4.20.js _site/index.html
      - name: Audit and inject Rank 2101-2200
        run: node inject-v1.4.21.js _site/index.html
      - name: Audit and inject Rank 2201-2300
        run: NODE_OPTIONS="--require=$PWD/fix-pack-2201-2300-v1.4.22.js" node inject-v1.4.22.js _site/index.html
      - name: Audit and inject Rank 2301-2400
        run: node inject-v1.4.23.js _site/index.html
      - name: Final Rank 2400 UI and regression audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text()
          replacements={
            'FSRS · v1.4.19':'FSRS · v1.4.23',
            'Web公開版 v1.4.19':'Web公開版 v1.4.23',
            '教材化済み：Rank 1–2000':'教材化済み：Rank 1–2400'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'UI label missing: {old}')
              s=s.replace(old,new)
          required=[
            'const APP_VERSION="1.4.23";',
            '이 노래 가사를 잘 못 알아들었어요.',
            '다음 주에 사흘 동안 휴가를 쓸 거예요.',
            '아버님은 지금 집에 계세요.',
            '억지로 먹지 않아도 돼요.',
            'id="startBtn"','id="showAnswerBtn"','id="knownBtn"',
            'id="saveSettingsBtn"','id="cloudSyncNowBtn"','id="exportBtn"','id="importProgress"',
            'document.getElementById("startBtn").addEventListener("click"',
            'document.getElementById("showAnswerBtn").addEventListener("click"',
            'document.getElementById("knownBtn").addEventListener("click"',
            'document.getElementById("saveSettingsBtn").addEventListener("click"',
            'syncBtn.addEventListener("click",()=>syncCloudCore(true))',
            'document.getElementById("exportBtn").addEventListener("click"',
            'document.getElementById("importProgress").addEventListener("change"',
            'korean-daily-3000-state-v01','korean-daily-3000-settings-v01','korean-daily-3000-sync-v01',
            'function initCloudSync(','function syncCloudCore(','function queueCloudSave(',
            'const READY=new Map(PACK.filter'
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'regression token missing: {token}')
          pack=s.find('const PACK=')
          if pack < 0: pack=s.find('let PACK=')
          ready=s.find('const READY=new Map(PACK.filter')
          push=s.rfind('PACK.push(',0,ready)
          if not (0 <= pack < push < ready):
              raise SystemExit(f'PACK initialization order invalid: {pack}, {push}, {ready}')
          if s.count('"rank":2301') != 1 or s.count('"rank":2400') != 1:
              raise SystemExit('Rank 2301/2400 occurrence audit failed')
          p.write_text(s)
          print('OK final Rank 2400 UI/buttons/events/SRS-settings-sync keys/PACK order/cloud regression audit')
          PY
      - name: Finalize app shell
        run: |
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4